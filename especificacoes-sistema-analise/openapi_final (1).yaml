openapi: 3.0.0
info:
  title: Fiança Locatícia
  description: |-
   O que é?
   
    Indicado para quem deseja alugar um imóvel, o Seguro Fiança Locatícia da Too Seguros é uma garantia locatícia reconhecida pela lei do inquilinato que assim como o Fiador e o Caução, garante ao proprietário de imóvel (locador) o recebimento dos aluguéis e encargos vencidos e não pagos pelo inquilino.
    
    Vantagens e benefícios
    
    O Seguro Fiança da Too Seguros é um facilitador do processo de locação para inquilinos, proprietários e imobiliárias.
    Para o inquilino, agilidade no processo de locação do imóvel, sem a necessidade de ter que apresentar fiador ou caução, além de serviços emergenciais para a residência.

    Para o proprietário, segurança no recebimento do aluguel, além de coberturas de IPTU, condomínio, água, luz, gás canalizado, multa por rescisão, pintura, danos ao imóvel e danos aos móveis.
    
    Para imobiliárias análise cadastral gratuita de seus clientes, suporte jurídico em caso de inadimplência do aluguel e redução substancial de custos operacionais.
    
    Como funciona o seguro fiança?
    
    O seguro garante ao proprietário o recebimento de aluguéis e encargos não pagos pelo inquilino até a desocupação do imóvel ou o esgotamento das ISs (importância segurada) contratadas.
    
    Principais Papéis
    
    Dentro deste seguro temos 02 principais papéis:
    
    Segurado = proponente/ locador/ Proprietário do imóvel
    
    Garantido = pretendente / locatário/ inquilino do imóvel
    
    O garantido(inquilino) fica responsável pela contratação e pagamento do seguro, enquanto o segurado(proprietário do imóvel) beneficiário deste seguro, é quem receberá a indenização em caso de inadimplência do inquilino.
